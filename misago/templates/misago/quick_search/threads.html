<div class="quick-search-threads">
  {% if results %}
    <ul>
      {% for result in results %}
        <li>
          <a href="{% url 'misago:post' post_id=result.post_id %}">
            {{ result.thread_title|safe }}
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>NO RESULTS</p>
  {% endif %}
</div>
