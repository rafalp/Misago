{% load i18n %}

<div class="modal fade" id="quick-search" tabindex="-1" role="dialog" aria-labelledby="quick-search-title">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <form
        id="misago-quick-search"
        method="GET"
        hx-target="#misago-quick-search-results"
        hx-swap="innerHtml"
        hx-params="query"
      >
        <h4 class="sr-only" id="quick-search-title">
          {% translate "Search" context "quick search modal title" %}
        </h4>
        <div class="quick-search-form">
          <div class="quick-search-control">
            <input class="quick-search-input" type="text" name="query" placeholder="{% translate 'Search...' context 'quick search modal placeholder' %}" required>
            <button type="submit" class="quick-search-btn" aria-label="{% translate 'Search' context 'quick search modal btn' %}">
              {% include "tabler/search.svg" %}
            </button>
          </div>
          <ul class="quick-search-tabs">
            {% for scope in scopes %}
              <li>
                <label class="quick-search-tab">
                  <input name="action" value="{{ scope.url }}" type="radio"{% if forloop.first %} checked{% endif %}>
                  {{ scope.name }}
                </label>
              </li>
            {% endfor %}
          </ul>
        </div>
        <div id="misago-quick-search-results">
          <p class="quick-search-cta">
            {% translate "Lorem ipsum dolor met" context "quick search modal cta" %}
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
