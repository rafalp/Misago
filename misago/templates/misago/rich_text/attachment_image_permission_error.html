{% load i18n %}
<span
  class="rich-text-attachment-permission-error rich-text-image-permission-error"
  misago-rich-text-attachment="{{ attachment.name }}:{{ attachment.id }}"
>
  <span class="rich-text-attachment-permission-error-icon">
    {% include "tabler/photo.svg" %}
  </span>
  <span class="rich-text-attachment-permission-error-filename">
    {{ attachment.name }}
  </span>
  <span class="rich-text-attachment-permission-error-message">
    {% translate "You don't have permission to view this image." context "rich text attachment image permission error" %}
  </span>
</span>
