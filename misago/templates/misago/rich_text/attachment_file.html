{% load i18n %}
<div
  class="rich-text-attachment-file"
  misago-rich-text-attachment="{{ attachment.name }}:{{ attachment.id }}"
>
  <a href="{{ attachment.get_absolute_url }}" target="_blank" class="rich-text-attachment-file-link">
    <div class="rich-text-attachment-file-icon" aria-hidden="true">
      {% include "tabler/download.svg" %}
    </div>
    <div class="rich-text-attachment-file-content">
      <div class="rich-text-attachment-file-name">
        {{ attachment.name }}
      </div>
      <div class="rich-text-attachment-file-meta">
        {{ attachment.filetype.name }}
        &mdash;
        {{ attachment.size|filesizeformat }}
      </div>
    </div>
  </a>
  <a
    href="{{ attachment.get_details_url }}"
    target="_blank"
    class="rich-text-attachment-file-info-button"
    aria-label="{% translate 'See information' context 'rich text attachment info btn' %}"
  >
    {% include "tabler/info-circle.svg" %}
  </a>
</div>
